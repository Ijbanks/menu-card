<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Banks Burgers - Menu Card</h1>
    <form id="menu-form">
        <label for="menu-input">Paste your menu as JSON</label>
        <textarea id="menu-input" rows="8">
            [
            {"name": "Shrimp Burger", "price": 9.50},
            {"name": "Crab Cake Burger", "price": 12},
            {"name": "Veggie Burger", "price": 8.25},
            {"name": "Onion Rings", "price": 3}
]
        </textarea>

        <button type="submit">Show my Menu</button>
    </form>

    <p id="count"></p>
    <p id="menu-text"></p>




    <script src="script.js"></script>   
</body>
</html>
